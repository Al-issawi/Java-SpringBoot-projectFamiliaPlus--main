server.port=9000

# Unified database configuration using environment variables for privacy.
# Defaults point to local MySQL; override via env vars in deployment.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/familiaplus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:User1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Application name
spring.application.name=FamiliaPlus

# NOTE: Production profile (PostgreSQL) kept in application-production.properties.
# This file intentionally avoids hardcoding sensitive credentials.
