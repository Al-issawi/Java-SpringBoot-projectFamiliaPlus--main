#############################################
# Railway Deployment Configuration (TOML)   #
#############################################

# Use table sections so Railway parses correctly.

[build]
command = "mvn -q clean package -DskipTests"

[deploy]
startCommand = "java -Dserver.port=$PORT -jar target/familia_plus-0.0.1-SNAPSHOT.jar"

[env]
# MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD must be set in the Railway UI

# (Optional) If you later change artifact name/group/version adjust startCommand accordingly.